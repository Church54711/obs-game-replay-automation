name: Validate package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build and validate recipient package
        shell: pwsh
        run: ./package.ps1 -OutputDir "$env:RUNNER_TEMP\obs-game-replay-dist"

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: ./package.ps1 -OutputDir "$env:RUNNER_TEMP\obs-game-replay-dist-ps51"

      - name: Download verified portable setup compiler
        shell: pwsh
        run: ./tests/get-inno-setup.ps1 -Destination "$env:RUNNER_TEMP\inno"

      - name: Build Windows installer
        shell: powershell
        run: ./build-installer.ps1 -CompilerPath "$env:RUNNER_TEMP\inno\compiler\ISCC.exe" -OutputDir "$env:RUNNER_TEMP\obs-game-replay-dist" -SkipPackage

      - name: Test executable installation, upgrade and uninstall
        # Match the release workflow: start Setup from PS7, then exercise its
        # actual Windows PowerShell 5.1 bridge with the inherited environment.
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./tests/release-verification-tests.ps1 -SetupPath "$env:RUNNER_TEMP\obs-game-replay-dist\obs-game-replay-automation-$version-setup.exe"
          ./tests/windows-setup-tests.ps1 -SetupPath "$env:RUNNER_TEMP\obs-game-replay-dist\obs-game-replay-automation-$version-setup.exe" -EvidenceDir "$env:RUNNER_TEMP\setup-evidence"

      - name: Upload setup and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            ${{ runner.temp }}/obs-game-replay-dist/*-setup.exe*
            ${{ runner.temp }}/setup-evidence/
